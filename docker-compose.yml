# Local test without Postgres (closer to Render Free):
# docker compose up --build -> http://localhost:8080
services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Подставь нужную переменную/строку для SQLite под твой DatabaseUrl.cs
      DATABASE_URL: ${DATABASE_URL:-Data Source=/app/data/mymusic.db}
      STORAGE_PROVIDER: Local
      STORAGE_LOCAL_PATH: /app/storage
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    volumes:
      # Монтируем локальные папки с БД и музыкой для теста
      - ./data:/app/data:ro
      - ./storage:/app/storage:ro