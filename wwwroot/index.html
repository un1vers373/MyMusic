<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080A">
  <title>MyMusic</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="logo" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="9" fill="#FF3D81"/>
      <path d="M8 22V10l8 9 8-9v12" stroke="#0B0B0E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M5 4v16M10 4v16"/><path d="m14.5 5.2 4.6 14.2"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path class="fill" d="M8 5.5v13l11-6.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect class="fill" x="6.5" y="5" width="4" height="14" rx="1"/><rect class="fill" x="13.5" y="5" width="4" height="14" rx="1"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path class="fill" d="M19 5.5v13L9 12z"/><path d="M6.5 5v14"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path class="fill" d="M5 5.5v13L15 12z"/><path d="M17.5 5v14"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.5c5 0 5 10 10 10H21m0 0-3-3m3 3-3 3"/><path d="M3 17h3.5c1.6 0 2.7-.9 3.6-2.2M13.5 9.2C14.4 7.9 15.5 7 17 7h4m0 0-3-3m3 3-3 3"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9.5A2.5 2.5 0 0 1 6.5 7H20m0 0-3-3m3 3-3 3"/><path d="M20 13v1.5a2.5 2.5 0 0 1-2.5 2.5H4m0 0 3 3m-3-3 3-3"/></symbol>
    <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="M4 11V9.5A2.5 2.5 0 0 1 6.5 7H20m0 0-3-3m3 3-3 3"/><path d="M20 13v1.5a2.5 2.5 0 0 1-2.5 2.5H4m0 0 3 3m-3-3 3-3"/><path d="M11 10.5l1.5-1v5.5"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="m16 9.5 5 5m0-5-5 5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l.8 12.5h9.4L17.5 7M10 11v5M14 11v5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4.5 15v4.5h15V15"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle class="fill" cx="5.5" cy="12" r="1.6"/><circle class="fill" cx="12" cy="12" r="1.6"/><circle class="fill" cx="18.5" cy="12" r="1.6"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4.5H5.5v15H10M14 8l4 4-4 4M18 12H9.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  </defs>
</svg>

<!-- Sign in / create account -->
<section id="auth" class="auth" hidden>
  <div class="auth-card">
    <div class="brand brand-lg"><svg class="logo"><use href="#logo"/></svg><span>MyMusic</span></div>
    <p class="auth-tag">Your music, your library.</p>
    <div class="seg" role="tablist">
      <button type="button" role="tab" data-auth-tab="login" class="on">Sign in</button>
      <button type="button" role="tab" data-auth-tab="register" id="tab-register">Create account</button>
    </div>
    <form id="auth-form" novalidate>
      <label class="field">Username
        <input name="username" autocomplete="username" required minlength="3" maxlength="32" autocapitalize="none" spellcheck="false">
      </label>
      <label class="field">Password
        <input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
      </label>
      <p class="form-error" id="auth-error" role="alert"></p>
      <button class="btn primary wide" type="submit" id="auth-submit">Sign in</button>
    </form>
  </div>
</section>

<!-- Application -->
<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="panel nav-panel">
      <a href="#/" class="brand"><svg class="logo"><use href="#logo"/></svg><span>MyMusic</span></a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></a>
        <a href="#/search" data-nav="search"><svg class="ic"><use href="#i-search"/></svg><span>Search</span></a>
        <a href="#/library" data-nav="library"><svg class="ic"><use href="#i-library"/></svg><span>Your Library</span></a>
        <a href="#/liked" data-nav="liked"><svg class="ic"><use href="#i-heart"/></svg><span>Liked Songs</span></a>
      </nav>
    </div>
    <div class="panel pl-panel">
      <div class="pl-head">
        <h2>Playlists</h2>
        <button class="icon-btn" data-action="new-playlist" aria-label="Create playlist" title="Create playlist"><svg class="ic"><use href="#i-plus"/></svg></button>
      </div>
      <ul id="side-playlists" class="side-pl"></ul>
    </div>
    <div class="panel user-panel">
      <div class="avatar" id="user-avatar">?</div>
      <span class="user-name" id="user-name"></span>
      <button class="icon-btn" data-action="logout" aria-label="Sign out" title="Sign out"><svg class="ic"><use href="#i-logout"/></svg></button>
    </div>
  </aside>

  <main class="panel main" id="main">
    <header class="topbar">
      <a href="#/" class="brand mobile-only"><svg class="logo"><use href="#logo"/></svg><span>MyMusic</span></a>
      <span class="spacer"></span>
      <button class="btn pill" data-action="upload"><svg class="ic"><use href="#i-upload"/></svg><span>Upload</span></button>
      <button class="icon-btn mobile-only" data-action="logout" aria-label="Sign out"><svg class="ic"><use href="#i-logout"/></svg></button>
    </header>
    <div id="view" class="view" tabindex="-1"></div>
  </main>

  <footer class="player" id="player" aria-label="Player">
    <div class="np">
      <div class="np-cover" id="np-cover"></div>
      <div class="np-meta">
        <span class="np-title" id="np-title">Nothing playing</span>
        <span class="np-artist" id="np-artist">Pick a song to start</span>
      </div>
      <button class="icon-btn like" id="np-like" data-action="like" aria-label="Like" disabled><svg class="ic"><use href="#i-heart"/></svg></button>
    </div>

    <div class="pc">
      <div class="pc-btns">
        <button class="icon-btn" id="btn-shuffle" aria-label="Shuffle" title="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn" id="btn-prev" aria-label="Previous" title="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button class="play-btn" id="btn-play" aria-label="Play" title="Play"><svg class="ic"><use href="#i-play"/></svg></button>
        <button class="icon-btn" id="btn-next" aria-label="Next" title="Next"><svg class="ic"><use href="#i-next"/></svg></button>
        <button class="icon-btn" id="btn-repeat" aria-label="Repeat" title="Repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="pc-bar">
        <span id="t-cur" class="time">0:00</span>
        <input type="range" id="seek" class="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <span id="t-dur" class="time">0:00</span>
      </div>
    </div>

    <div class="pv">
      <button class="icon-btn" id="btn-mute" aria-label="Mute"><svg class="ic"><use href="#i-volume"/></svg></button>
      <input type="range" id="vol" class="range" min="0" max="100" value="80" step="1" aria-label="Volume">
    </div>
  </footer>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></a>
    <a href="#/search" data-nav="search"><svg class="ic"><use href="#i-search"/></svg><span>Search</span></a>
    <a href="#/library" data-nav="library"><svg class="ic"><use href="#i-library"/></svg><span>Library</span></a>
    <a href="#/liked" data-nav="liked"><svg class="ic"><use href="#i-heart"/></svg><span>Liked</span></a>
  </nav>
</div>

<audio id="audio" preload="metadata"></audio>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
